    name: Run Bale Bot on Push # نام Workflow

    on:
      push: # هر وقت کدی به شاخه main پوش شود، اجرا می‌شود
        branches: [ main ]
      workflow_dispatch: # این امکان را می‌دهد که دستی از صفحه Actions اجرا کنی

    jobs:
      run_bot: # نام Job
        runs-on: ubuntu-latest # سیستم عامل که Job روی آن اجرا می‌شود (یک سرور مجازی اوبونتو)
        timeout-minutes: 360 # حداکثر زمان اجرا به دقیقه (۶ ساعت). برای تست کافی است.

        steps:
          - name: Checkout code # مرحله اول: دانلود کدهای ریپازیتوری
            uses: actions/checkout@v4 # از اکشن آماده برای دانلود کد استفاده می‌کند

          - name: Set up Python # مرحله دوم: نصب پایتون
            uses: actions/setup-python@v5
            with:
              python-version: '3.9' # ورژن پایتون مورد نیازت را اینجا مشخص کن

          - name: Install dependencies # مرحله سوم: نصب کتابخانه‌های مورد نیاز
            run: pip install -r requirements.txt # از فایل requirements.txt استفاده می‌کند

          - name: Store Secrets in Environment Variables # مرحله چهارم: تنظیم کلیدهای امنیتی
            env:
              BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
              API_ID: ${{ secrets.API_ID }}
              API_HASH: ${{ secrets.API_HASH }}
            run: echo "Secrets are set" # این خط فقط برای این است که مرحله موفقیت‌آمیز دیده شود

          - name: Run the Bot # مرحله پنجم: اجرای اسکریپت ربات
            run: python main.py # اینجا نام فایل اصلی رباتت را بنویس (مثلاً main.py یا bot.py)
            
