name: Run Bale Bot on Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # به جای checkout اکشن، خودمون دستی کد رو کش می‌کنیم
      - name: Checkout code manually
        run: git clone https://github.com/${{ github.repository }}.git .

      # به جای setup-python، خودمان پایتون را نصب می‌کنیم
      - name: Install Python manually
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip3 install -r requirements.txt; fi

      - name: Run the Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: python3 main.py
        
