name: Run Bale Bot on Push

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run_bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        # استفاده از SHA دقیق و استاندارد برای checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        # استفاده از SHA دقیق و استاندارد برای setup-python
        uses: actions/setup-python@0b93645e5efa73187a3b5057f311c16828230537
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: python main.py
        
