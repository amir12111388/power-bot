name: Run Balle Bot

on:
  push:
    branches: [ main ]
  workflow_dispatch: # این دکمه باعث می‌شود دستی هم بتوانی ربات را اجرا کنی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install telethon # یا هر کتابخانه‌ای که استفاده می‌کنی

      - name: Run Bot
        run: python main.py # اسم فایل اصلی رباتت
        
