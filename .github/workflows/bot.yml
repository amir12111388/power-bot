name: Run My Bot

on:
  push:
    branches:
      - main
  workflow_dispatch: # اجازه می‌دهد دستی دکمه Run را بزنی

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # استفاده از SHA دقیق برای Checkout به جای v4
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # استفاده از SHA دقیق برای Setup Python به جای v5
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.10'

      - name: List files (Check location)
        run: ls -R

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping install."
          fi

      - name: Run the Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          python3 main.py 2>&1
          
